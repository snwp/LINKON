[package]
name = "linkon"
version = "2.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linkon_lib"
# shortcut: só rlib, porque o linker mingw falha na cdylib ("export ordinal too large").
# Voltar para ["staticlib", "cdylib", "rlib"] se o Linkon ganhar versão mobile.
crate-type = ["rlib"]
# Testes do banco rodam em tests/db.rs; ver o comentário lá.
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
# Geração de imagens pela API da OpenAI (HTTPS com rustls) e a chave no Gerenciador de Credenciais do Windows.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
# Servidor local do "Ver no navegador" (só 127.0.0.1).
tiny_http = "0.12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
